# GANI Copilot model configuration. Never commit API keys.
[llm]
provider = "gemini"
model = "gemini-3.8-flash"
api_key_env = "GEMINI_API_KEY"
max_tokens = 8000
# Supported examples: gemini-3.8-flash, gemini-3.1-pro, gemini-2.5-flash, gemini-2.5-pro
# Set GEMINI_API_KEY in the environment. Never put the key in this file.

[server]
host = "127.0.0.1"
port = 8765

[critic]
max_rounds = 3
